[project]
name = "iam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.137.2",
    "greenlet>=3.5.2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=5",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.14.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
exclude = ["^alembic/"]
